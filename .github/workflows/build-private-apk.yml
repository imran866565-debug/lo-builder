name: Build Private APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Private repo branch to build'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: imran866565-debug/Agent_App_Final
          token: ${{ secrets.BUILDER_TOKEN }}
          ref: ${{ github.event.inputs.branch }}
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        working-directory: ./source
        run: chmod +x ./gradlew

      # =========================================================
      # RESTORE EXISTING KEY OR GENERATE FIRST KEY
      # =========================================================

      - name: Restore existing signing key
        id: restore_key
        working-directory: ./source
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing signing key restored."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No signing key found. A new one will be generated."
          fi

      - name: Generate new signing key
        if: steps.restore_key.outputs.exists != 'true'
        working-directory: ./source
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "New signing key generated."

      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build debug APK
        working-directory: ./source
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build-out.txt"

      - name: Report Kotlin errors
        if: failure()
        working-directory: ./source
        env:
          GH_TOKEN: ${{ secrets.BUILDER_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/build-out.txt"
          ERRORS=$(grep -aE "^e: " "$OUT" | head -50 || true)
          if [ -z "$ERRORS" ]; then
            {
              grep -aE "Caused by:|Execution failed for task|OutOfMemoryError|StackOverflowError" "$OUT" | head -25 || true;
              echo "----- tail -----";
              tail -c 11000 "$OUT";
            } > /tmp/errfull.txt
            ERRORS=$(cat /tmp/errfull.txt)
          fi
          SHA=$(git rev-parse HEAD)
          BODY=$(printf 'Build #%s errors:\n```\n%s\n```' "$GITHUB_RUN_NUMBER" "$ERRORS")
          gh api -X POST "repos/imran866565-debug/Agent_App_Final/commits/$SHA/comments" -f body="$BODY" > /dev/null || true

      # =========================================================
      # SAVE NEW KEY TO GITHUB SECRET
      # =========================================================

      - name: Save newly generated key to GitHub Secret
        if: steps.restore_key.outputs.exists != 'true'
        working-directory: ./source
        env:
          GH_TOKEN: ${{ secrets.BUILDER_TOKEN }}
          GH_REPO: imran866565-debug/Agent_App_Final
        run: |
          base64 -w 0 debug.keystore > debug.keystore.base64

          gh secret set ANDROID_DEBUG_KEYSTORE_BASE64 \
            --repo "$GH_REPO" \
            < debug.keystore.base64

          rm -f debug.keystore.base64

          echo "Signing key permanently saved to GitHub Secrets."

      # =========================================================
      # PREPARE APK
      # =========================================================

      - name: Prepare APK
        run: |
          mkdir -p out

          cp source/app/build/outputs/apk/debug/app-debug.apk \
            "out/LO-debug-${{ github.run_number }}.apk"

      # =========================================================
      # PRIVATE GITHUB RELEASE
      # =========================================================

      - name: Publish release to private repo
        env:
          GH_TOKEN: ${{ secrets.BUILDER_TOKEN }}
          GH_REPO: imran866565-debug/Agent_App_Final
        run: |
          gh release create v0.${{ github.run_number }} \
            --repo "$GH_REPO" \
            --title "LO Debug v0.${{ github.run_number }}" \
            --notes "Automated build from private source (Run #${{ github.run_number }})" \
            out/*.apk
